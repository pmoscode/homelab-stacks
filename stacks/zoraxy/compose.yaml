# Zoraxy: public entry point (WAN 80/443 via UniFi port forwarding). Runs on the UGreen NAS
# (Komodo server nas-ugreen), replaces LXC 100 (10.0.1.17) on the old Proxmox.
# Fresh setup, rules are configured in the web UI (http://<nas>:8000), state in ${ZORAXY_DATA}.
# Target state (hosts, TLS via deSEC DNS-01, access rules): README.md next to this file.
# Traefik trusts X-Forwarded-* only from ZORAXY_IP (homelab-stacks: komodo/traefik.toml).
# No Docker socket (container discovery not needed), no mDNS, no FASTGEOIP (+1 GB RAM).
services:
  zoraxy:
    image: zoraxydocker/zoraxy:v3.3.4
    container_name: zoraxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"   # management UI, LAN only (UniFi forwards only 80/443)
    environment:
      TZ: Europe/Berlin
      PORT: "8000"
      MDNS: "false"
      FASTGEOIP: "false"
      ZEROTIER: "false"
    volumes:
      - ${ZORAXY_DATA}/config:/opt/zoraxy/config
      - ${ZORAXY_DATA}/plugin:/opt/zoraxy/plugin
