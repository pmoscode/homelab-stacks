# Minecraft (Fabric 26.2, creative, LAN only), from LXC 104 on the old Proxmox. Same image build,
# Minecraft, Fabric and mod versions as there (pinned, itzg would otherwise update at every start).
#
# lazymc keeps the server stopped while nobody plays: it answers the server list ping itself
# ("sleeping" MOTD), starts the container on the first join and stops it after sleep_after.
# Clients connect to ${MC_HOST} (port 25565 = lazymc). The server container has no restart
# policy, lazymc alone starts and stops it. Komodo alerts are off for this stack (komodo/minecraft.toml),
# Gatus checks that lazymc answers.
#
# lazymc talks to Docker only through socket-proxy (list, start, stop containers), via a Unix
# socket in a volume shared by the two. lazymc accepts connections from the LAN, the raw socket
# would be root on the host.
#
# lazymc needs fixed container IPs (it does not resolve the address again after a restart).
#
# squaremap (web map) and the resource pack: http://${MC_HOST}:8080, only while the server runs.
# Ports 25565 and 8080 are opened for the LAN in homelab-komodo (host_vars/apps-node-1.yml).
services:
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2
    container_name: minecraft-socket-proxy
    restart: unless-stopped
    user: "65534:989"          # 989 = docker group on apps-node-1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    environment:
      SP_PROXYSOCKETENDPOINT: /run/proxy/docker.sock
      SP_ALLOW_HEAD: /_ping
      SP_ALLOW_GET: /_ping
      SP_ALLOW_GET_2: /v1\.[0-9]+/(version|containers/json.*)
      SP_ALLOW_POST: /v1\.[0-9]+/containers/[a-zA-Z0-9_.-]+/(start|stop).*
      SP_WATCHDOGINTERVAL: "60"
      SP_STOPONWATCHDOG: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-socket:/run/proxy

  lazymc:
    image: ghcr.io/joesturge/lazymc-docker-proxy:v2.7.5
    container_name: minecraft-lazymc
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: unix:///run/proxy/docker.sock
    networks:
      minecraft:
        ipv4_address: 172.30.0.2
    ports:
      - "25565:25565"
    volumes:
      - proxy-socket:/run/proxy
      - /srv/data/minecraft:/server:ro   # server.properties, whitelist, banned IPs

  mc:
    image: itzg/minecraft-server:2026.9.0-java25
    container_name: minecraft
    restart: "no"
    tty: true
    stdin_open: true
    mem_limit: 4g              # heap 3 GB plus JVM overhead
    stop_grace_period: 90s     # mc-server-runner waits up to 60 s for the save
    networks:
      minecraft:
        ipv4_address: 172.30.0.3
    ports:
      - "8080:8080"            # squaremap, resource pack
    environment:
      EULA: "TRUE"
      MEMORY: 3G
      TZ: Europe/Berlin
      TYPE: FABRIC
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: 0.19.5
      FABRIC_LAUNCHER_VERSION: 1.1.2
      MODE: creative
      # Offline mode as before (accounts without Mojang login), only whitelisted names may join.
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      RESOURCE_PACK: http://${MC_HOST}:8080/resource_pack.zip
      RESOURCE_PACK_SHA1: c97ecedfcb4b40b8f5b26bd9d68bb9766d2f2f3f
      # Modrinth version IDs (identified by file hash on 2026-11-07), dependencies listed explicitly.
      MODRINTH_PROJECTS: |
        fabric-api:UWwhUX3k
        polymer:561YnR5f
        collective:M75JwjyS
        polydecorations:byp83CQs
        easy-elevators:DcCf4yj9
        squaremap:QoKeDHFP
      MODRINTH_DOWNLOAD_DEPENDENCIES: none
    volumes:
      - /srv/data/minecraft:/data
    labels:
      - lazymc.enabled=true
      - lazymc.group=minecraft
      - lazymc.server.address=172.30.0.3:25565
      - lazymc.server.directory=/server
      # Wake the server once when lazymc starts, so the server list shows the real version and MOTD.
      - lazymc.server.probe_on_start=true
      - lazymc.server.wake_whitelist=true
      - lazymc.time.sleep_after=600
      - lazymc.time.minimum_online_time=300
      - lazymc.join.methods=hold,kick
      - lazymc.join.hold.timeout=25
      - lazymc.motd.sleeping=☠ Server schläft – beitreten zum Starten
      - lazymc.motd.starting=§2☻ Server startet …
      - lazymc.motd.stopping=☠ Server fährt herunter …
      - lazymc.motd.from_server=true
      - lazymc.join.kick.starting=Server startet, bitte in einer Minute noch einmal verbinden.
      - lazymc.join.kick.stopping=Server fährt gerade herunter, bitte gleich noch einmal versuchen.

networks:
  minecraft:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  # tmpfs, writable for the socket-proxy user only (lazymc runs as root)
  proxy-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=65534,gid=0,mode=0700,noexec
