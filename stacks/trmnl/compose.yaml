# TRMNL BYOS server (Laravel, from k8s). Public: https://${TRMNL_HOST} via Zoraxy.
# SQLite in database/storage, generated screen images in images/generated (both migrated from
# nfs-internal PVCs, owned by www-data = UID 82).
# The image copies .env.example to .env, so without APP_KEY it runs with the public example key.
# Own key from the Komodo secret TRMNL_APP_KEY (no data is encrypted with it, changing it only ends sessions).
# APP_URL builds the image_url handed to the device; unset it is http://localhost.
services:
  trmnl:
    image: ghcr.io/usetrmnl/byos_laravel:0.46.0
    container_name: trmnl
    restart: unless-stopped
    environment:
      APP_KEY: ${TRMNL_APP_KEY:?TRMNL_APP_KEY missing}
      APP_URL: https://${TRMNL_HOST}
      DB_DATABASE: /var/www/html/database/storage/database.sqlite
      APP_TIMEZONE: Europe/Berlin
      FORCE_HTTPS: "1"
      PHP_OPCACHE_ENABLE: "1"
      TRMNL_PROXY_REFRESH_MINUTES: "5"
    volumes:
      - /srv/data/trmnl/database:/var/www/html/database/storage
      - /srv/data/trmnl/generated:/var/www/html/storage/app/public/images/generated
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.trmnl.rule=Host(`${TRMNL_HOST}`)
      - traefik.http.routers.trmnl.entrypoints=web
      - traefik.http.services.trmnl.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
