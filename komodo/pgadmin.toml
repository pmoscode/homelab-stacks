# App stack: no "deploy = true". The first deploy is done by the migration cutover
# (homelab-komodo: task migrate:cutover APP=pgadmin).
[[stack]]
name = "pgadmin"
description = "Postgres admin UI (LAN only)"

[stack.config]
server = "apps-node-1"
repo = "pmoscode/homelab-stacks"
branch = "main"
run_directory = "stacks/pgadmin"
webhook_enabled = false
environment = """
PGADMIN_HOST=pgadmin.apps.lan
"""
