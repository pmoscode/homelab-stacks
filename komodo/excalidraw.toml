# App stack: no "deploy = true". The first deploy is done by the migration cutover
# (homelab-komodo: task migrate:cutover APP=excalidraw).
[[stack]]
name = "excalidraw"
description = "Whiteboard with collaboration server"

[stack.config]
server = "apps-node-1"
repo = "pmoscode/homelab-stacks"
branch = "main"
run_directory = "stacks/excalidraw"
webhook_enabled = false
environment = """
EXCALIDRAW_HOST=draw.apps.lan
"""
