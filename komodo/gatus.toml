# Infrastructure: deployed by the Resource Sync itself (deploy = true).
[[stack]]
name = "gatus"
description = "HTTP and certificate checks of all apps, on the UGreen NAS"
deploy = true

[stack.config]
server = "nas-ugreen"
repo = "pmoscode/homelab-stacks"
branch = "main"
run_directory = "stacks/gatus"
webhook_enabled = false
environment = """
GATUS_DATA=/volume1/docker/gatus
NTFY_TOPIC=[[NTFY_TOPIC]]
"""
