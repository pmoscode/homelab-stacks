# App stack: no "deploy = true". The first deploy is done by the migration cutover
# (homelab-komodo: task migrate:cutover APP=trmnl).
[[stack]]
name = "trmnl"
description = "TRMNL e-ink display server (BYOS Laravel)"

[stack.config]
server = "apps-node-1"
repo = "pmoscode/homelab-stacks"
branch = "main"
run_directory = "stacks/trmnl"
webhook_enabled = false
environment = """
TRMNL_HOST=trmnl.pmsys.dev
TRMNL_APP_KEY=[[TRMNL_APP_KEY]]
"""
