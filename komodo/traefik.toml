# Infrastructure: deployed by the Resource Sync itself (deploy = true).
[[stack]]
name = "traefik"
description = "Ingress behind Zoraxy, Docker API via socket proxy"
deploy = true

[stack.config]
server = "apps-node-1"
repo = "pmoscode/homelab-stacks"
branch = "main"
run_directory = "stacks/traefik"
webhook_enabled = false
environment = """
ZORAXY_IP=10.0.1.15
"""
